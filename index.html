<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Speed Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #333; margin-bottom: 5px; font-size: 2em; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 0.9em; }
        .speed-display {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .speed-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .speed-item.active { background: #e8ecff; box-shadow: 0 0 20px rgba(102, 126, 234, 0.1); }
        .speed-value { font-size: 2.2em; font-weight: bold; color: #667eea; transition: all 0.3s ease; }
        .speed-value.measuring { animation: pulse 0.8s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .speed-label { font-size: 0.85em; color: #666; margin-top: 5px; }
        .speed-unit { font-size: 0.5em; color: #999; }
        .progress-container { width: 100%; height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden; margin: 20px 0; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); transition: width 0.3s ease; }
        .test-details { display: flex; justify-content: space-between; margin: 15px 0; font-size: 0.85em; color: #888; }
        .status { text-align: center; margin-top: 15px; color: #666; font-size: 0.95em; min-height: 24px; }
        .status.error { color: #ef4444; }
        .status.success { color: #10b981; }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .info {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: #aaa;
            flex-wrap: wrap;
            gap: 10px;
        }
        .info-item .value { color: #667eea; font-weight: 600; }
        .server-list {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.75em;
            color: #888;
        }
        .server-list .server { display: inline-block; margin: 2px 8px; }
        .server-list .server.active { color: #667eea; font-weight: 600; }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            .speed-display { grid-template-columns: 1fr; gap: 10px; }
            .speed-value { font-size: 1.8em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Speed Test</h1>
        <p class="subtitle">Real download &amp; upload speed measurement</p>

        <div class="speed-display">
            <div class="speed-item" id="downloadItem">
                <div class="speed-value" id="downloadSpeed">--</div>
                <div class="speed-label">Download <span class="speed-unit">Mbps</span></div>
            </div>
            <div class="speed-item" id="uploadItem">
                <div class="speed-value" id="uploadSpeed">--</div>
                <div class="speed-label">Upload <span class="speed-unit">Mbps</span></div>
            </div>
            <div class="speed-item" id="pingItem">
                <div class="speed-value" id="ping">--</div>
                <div class="speed-label">Ping <span class="speed-unit">ms</span></div>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="test-details">
            <span id="testPhase">Ready</span>
            <span id="testProgress">0%</span>
        </div>

        <button id="startTest" onclick="startSpeedTest()">Start Test</button>

        <div class="status" id="status">Click "Start Test" to begin</div>

        <div class="server-list" id="serverList">
            <span style="font-weight:600;">Servers:</span>
            <span class="server" id="server1">📡 jsDelivr</span>
            <span class="server" id="server2">📡 cdnjs</span>
            <span class="server" id="server3">📡 unpkg</span>
        </div>

        <div class="info">
            <span class="info-item">
                <span class="label">Test Data:</span>
                <span class="value" id="dataInfo">~15 MB</span>
            </span>
            <span class="info-item">
                <span class="label">ISP:</span>
                <span class="value" id="ispInfo">--</span>
            </span>
        </div>
    </div>

    <script>
        // ============================================================
        // REAL SPEED TEST - Working upload with multiple endpoints
        // ============================================================
        
        let isTesting = false;
        let abortController = null;

        // DOWNLOAD test files (all CORS-enabled)
        const TEST_FILES = [
            {
                url: 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
                size: 600000,
                name: 'Three.js'
            },
            {
                url: 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
                size: 550000,
                name: 'Three.js (cdnjs)'
            },
            {
                url: 'https://unpkg.com/three@0.160.0/build/three.min.js',
                size: 600000,
                name: 'Three.js (unpkg)'
            },
            {
                url: 'https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js',
                size: 87000,
                name: 'jQuery'
            },
            {
                url: 'https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js',
                size: 87000,
                name: 'jQuery (cdnjs)'
            }
        ];

        // UPLOAD endpoints - multiple options for redundancy
        const UPLOAD_ENDPOINTS = [
            'https://httpbin.org/post',           // Reliable, CORS-enabled
            'https://postman-echo.com/post',      // Backup
        ];

        // Ping test endpoints
        const PING_URLS = [
            'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
            'https://unpkg.com/three@0.160.0/build/three.min.js',
        ];

        // ============================================================
        // UTILITY FUNCTIONS
        // ============================================================
        
        function updateProgress(phase, progress, statusText) {
            document.getElementById('testPhase').textContent = phase;
            document.getElementById('testProgress').textContent = Math.round(progress) + '%';
            document.getElementById('progressBar').style.width = Math.min(progress, 100) + '%';
            if (statusText) document.getElementById('status').textContent = statusText;
        }

        function setLoading(elementId, isLoading) {
            const el = document.getElementById(elementId);
            if (isLoading) el.classList.add('measuring');
            else el.classList.remove('measuring');
        }

        function markServerActive(serverId) {
            document.querySelectorAll('.server').forEach(s => s.classList.remove('active'));
            if (serverId) document.getElementById(serverId).classList.add('active');
        }

        // ============================================================
        // MEASURE PING
        // ============================================================
        async function measurePing() {
            const pingTimes = [];
            const attempts = 6;
            
            for (let i = 0; i < attempts; i++) {
                const url = PING_URLS[i % PING_URLS.length] + '?cache=' + Date.now() + Math.random();
                const start = performance.now();
                try {
                    await fetch(url, { 
                        method: 'HEAD', 
                        cache: 'no-store',
                        signal: abortController?.signal 
                    });
                    const latency = performance.now() - start;
                    if (latency < 1000) {
                        pingTimes.push(latency);
                    }
                } catch (e) {
                    if (e.name === 'AbortError') throw e;
                }
                
                const progress = ((i + 1) / attempts) * 10;
                updateProgress('Pinging...', progress, `Ping ${i+1}/${attempts}`);
                if (i < attempts - 1) {
                    await new Promise(r => setTimeout(r, 150));
                }
            }

            if (pingTimes.length === 0) return 0;
            pingTimes.sort((a, b) => a - b);
            return Math.round((pingTimes[Math.floor(pingTimes.length / 2)]) * 10) / 10;
        }

        // ============================================================
        // MEASURE DOWNLOAD
        // ============================================================
        async function measureDownload() {
            const speeds = [];
            
            for (let i = 0; i < TEST_FILES.length; i++) {
                const file = TEST_FILES[i];
                markServerActive('server' + (i % 3 + 1));
                
                try {
                    const start = performance.now();
                    const response = await fetch(file.url, {
                        cache: 'no-store',
                        signal: abortController?.signal
                    });
                    
                    if (!response.ok) continue;
                    
                    const reader = response.body.getReader();
                    let received = 0;
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        received += value.length;
                        
                        const baseProgress = 10 + (i / TEST_FILES.length) * 50;
                        const fileProgress = (received / file.size) * 50 / TEST_FILES.length;
                        const progress = baseProgress + fileProgress;
                        
                        updateProgress(
                            'Downloading...', 
                            progress, 
                            `Downloading ${file.name}... ${(received/1024).toFixed(0)}KB`
                        );
                    }
                    
                    const duration = (performance.now() - start) / 1000;
                    if (duration > 0.1 && received > 10000) {
                        const speed = (received * 8) / (duration * 1000000);
                        speeds.push(speed);
                    }
                    
                } catch (e) {
                    if (e.name === 'AbortError') throw e;
                    console.warn(`Download failed for ${file.name}:`, e);
                }
            }

            if (speeds.length === 0) return 0;
            
            speeds.sort((a, b) => a - b);
            const start = Math.floor(speeds.length * 0.1);
            const end = Math.ceil(speeds.length * 0.9);
            const trimmed = speeds.slice(start, end);
            
            return trimmed.reduce((a, b) => a + b, 0) / trimmed.length;
        }

        // ============================================================
        // MEASURE UPLOAD - FIXED with multiple endpoints
        // ============================================================
        async function measureUpload() {
            const chunkSize = 256 * 1024; // 256KB chunks (smaller for reliability)
            const totalSize = 2 * 1024 * 1024; // 2MB total
            let uploaded = 0;
            const speeds = [];
            const startTime = performance.now();
            
            // Try each upload endpoint until one works
            for (const endpoint of UPLOAD_ENDPOINTS) {
                try {
                    // Test if endpoint works
                    const testForm = new FormData();
                    testForm.append('test', 'ping');
                    const testResp = await fetch(endpoint, {
                        method: 'POST',
                        body: testForm,
                        signal: abortController?.signal
                    });
                    if (!testResp.ok) continue;
                    
                    console.log(`Using upload endpoint: ${endpoint}`);
                    
                    // Upload chunks
                    while (uploaded < totalSize) {
                        const currentSize = Math.min(chunkSize, totalSize - uploaded);
                        const data = new Uint8Array(currentSize);
                        for (let i = 0; i < currentSize; i += 65536) {
                            const end = Math.min(i + 65536, currentSize);
                            const rand = crypto.getRandomValues(new Uint8Array(end - i));
                            data.set(rand, i);
                        }
                        
                        const chunkStart = performance.now();
                        const formData = new FormData();
                        formData.append('file', new Blob([data]), 'upload.bin');
                        
                        const response = await fetch(endpoint, {
                            method: 'POST',
                            body: formData,
                            signal: abortController?.signal
                        });
                        
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        await response.text(); // Consume response
                        
                        const chunkDuration = (performance.now() - chunkStart) / 1000;
                        if (chunkDuration > 0.05) {
                            const speed = (currentSize * 8) / (chunkDuration * 1000000);
                            speeds.push(speed);
                        }
                        
                        uploaded += currentSize;
                        
                        // Update progress (60-95%)
                        const progress = 60 + (uploaded / totalSize) * 35;
                        updateProgress(
                            'Uploading...', 
                            progress, 
                            `Uploading... ${(uploaded/1024/1024).toFixed(2)}MB`
                        );
                    }
                    
                    // If we got here, upload succeeded
                    break;
                    
                } catch (e) {
                    if (e.name === 'AbortError') throw e;
                    console.warn(`Upload endpoint ${endpoint} failed:`, e);
                    // Reset uploaded for next endpoint
                    uploaded = 0;
                    speeds.length = 0;
                    continue;
                }
            }

            const totalDuration = (performance.now() - startTime) / 1000;
            const avgSpeed = (uploaded * 8) / (totalDuration * 1000000);
            
            if (speeds.length > 0) {
                speeds.sort((a, b) => a - b);
                const median = speeds[Math.floor(speeds.length / 2)];
                return Math.min(avgSpeed, median * 1.2);
            }
            
            return avgSpeed || 0;
        }

        // ============================================================
        // DETECT ISP
        // ============================================================
        async function detectISP() {
            try {
                const response = await fetch('https://ipapi.co/json/', {
                    signal: abortController?.signal
                });
                const data = await response.json();
                return data.org || data.isp || 'Unknown ISP';
            } catch {
                return '--';
            }
        }

        // ============================================================
        // MAIN SPEED TEST
        // ============================================================
        async function startSpeedTest() {
            if (isTesting) return;
            isTesting = true;
            
            const button = document.getElementById('startTest');
            const statusEl = document.getElementById('status');
            
            // Reset UI
            document.getElementById('downloadSpeed').textContent = '--';
            document.getElementById('uploadSpeed').textContent = '--';
            document.getElementById('ping').textContent = '--';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('testPhase').textContent = 'Starting...';
            document.getElementById('testProgress').textContent = '0%';
            statusEl.className = 'status';
            button.disabled = true;
            button.textContent = 'Testing...';
            statusEl.textContent = 'Initializing...';
            
            document.querySelectorAll('.server').forEach(s => s.classList.remove('active'));
            
            abortController = new AbortController();
            
            try {
                // Detect ISP
                statusEl.textContent = 'Detecting ISP...';
                const isp = await detectISP();
                document.getElementById('ispInfo').textContent = isp;
                
                // Test Ping
                statusEl.textContent = 'Measuring ping...';
                setLoading('ping', true);
                const pingResult = await measurePing();
                document.getElementById('ping').textContent = pingResult.toFixed(1);
                setLoading('ping', false);
                
                const pingEl = document.getElementById('ping');
                pingEl.style.color = pingResult < 50 ? '#10b981' : 
                                     pingResult < 100 ? '#f59e0b' : '#ef4444';
                
                // Test Download
                statusEl.textContent = 'Testing download speed...';
                document.getElementById('downloadItem').classList.add('active');
                setLoading('downloadSpeed', true);
                const downloadResult = await measureDownload();
                document.getElementById('downloadSpeed').textContent = downloadResult.toFixed(1);
                setLoading('downloadSpeed', false);
                document.getElementById('downloadItem').classList.remove('active');
                
                const downloadEl = document.getElementById('downloadSpeed');
                downloadEl.style.color = downloadResult > 50 ? '#10b981' : 
                                        downloadResult > 20 ? '#f59e0b' : '#ef4444';
                
                // Test Upload
                statusEl.textContent = 'Testing upload speed...';
                document.getElementById('uploadItem').classList.add('active');
                setLoading('uploadSpeed', true);
                const uploadResult = await measureUpload();
                document.getElementById('uploadSpeed').textContent = uploadResult.toFixed(1);
                setLoading('uploadSpeed', false);
                document.getElementById('uploadItem').classList.remove('active');
                
                const uploadEl = document.getElementById('uploadSpeed');
                uploadEl.style.color = uploadResult > 20 ? '#10b981' : 
                                      uploadResult > 5 ? '#f59e0b' : '#ef4444';
                
                // Complete
                updateProgress('Complete!', 100, '✅ Test complete!');
                statusEl.className = 'status success';
                markServerActive('server1');
                
            } catch (error) {
                if (error.name === 'AbortError') {
                    statusEl.textContent = '⏹️ Test cancelled';
                } else {
                    statusEl.textContent = '❌ Test failed: ' + error.message;
                    statusEl.className = 'status error';
                }
                console.error('Speed test error:', error);
            } finally {
                button.disabled = false;
                button.textContent = 'Test Again';
                isTesting = false;
                abortController = null;
                document.getElementById('downloadItem').classList.remove('active');
                document.getElementById('uploadItem').classList.remove('active');
                setLoading('downloadSpeed', false);
                setLoading('uploadSpeed', false);
                setLoading('ping', false);
            }
        }

        // Cancel test on page hide
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isTesting && abortController) {
                abortController.abort();
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('dataInfo').textContent = '~15 MB';
            setTimeout(startSpeedTest, 1000);
        });
    </script>
</body>
</html>
