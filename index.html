<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speed Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #333; margin-bottom: 5px; font-size: 2em; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 0.9em; }
        .speed-display {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .speed-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .speed-item.active { background: #e8ecff; box-shadow: 0 0 20px rgba(102, 126, 234, 0.1); }
        .speed-value { font-size: 2.2em; font-weight: bold; color: #667eea; transition: all 0.3s ease; }
        .speed-value.measuring { animation: pulse 0.8s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .speed-label { font-size: 0.85em; color: #666; margin-top: 5px; }
        .speed-unit { font-size: 0.5em; color: #999; }
        .progress-container { width: 100%; height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden; margin: 20px 0; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); transition: width 0.3s ease; }
        .test-details { display: flex; justify-content: space-between; margin: 15px 0; font-size: 0.85em; color: #888; }
        .status { text-align: center; margin-top: 15px; color: #666; font-size: 0.95em; min-height: 24px; }
        .status.error { color: #ef4444; }
        .status.success { color: #10b981; }
        .status.warning { color: #f59e0b; }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .info {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: #aaa;
            flex-wrap: wrap;
            gap: 10px;
        }
        .info-item .value { color: #667eea; font-weight: 600; }
        .note {
            margin-top: 15px;
            padding: 12px;
            background: #fef3c7;
            border-radius: 8px;
            font-size: 0.85em;
            color: #92400e;
            border-left: 4px solid #f59e0b;
        }
        .success-note {
            background: #d1fae5;
            border-color: #10b981;
            color: #065f46;
        }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            .speed-display { grid-template-columns: 1fr; gap: 10px; }
            .speed-value { font-size: 1.8em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Speed Test</h1>
        <p class="subtitle">Real download &amp; upload speed measurement</p>

        <div class="speed-display">
            <div class="speed-item" id="downloadItem">
                <div class="speed-value" id="downloadSpeed">--</div>
                <div class="speed-label">Download <span class="speed-unit">Mbps</span></div>
            </div>
            <div class="speed-item" id="uploadItem">
                <div class="speed-value" id="uploadSpeed">--</div>
                <div class="speed-label">Upload <span class="speed-unit">Mbps</span></div>
            </div>
            <div class="speed-item" id="pingItem">
                <div class="speed-value" id="ping">--</div>
                <div class="speed-label">Ping <span class="speed-unit">ms</span></div>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="test-details">
            <span id="testPhase">Ready</span>
            <span id="testProgress">0%</span>
        </div>

        <button id="startTest" onclick="startSpeedTest()">Start Test</button>

        <div class="status" id="status">Click "Start Test" to begin</div>

        <div class="note" id="uploadNote">
            💡 <strong>Upload Test:</strong> Using multiple upload connections to a Cloudflare Worker.
        </div>

        <div class="info">
            <span class="info-item">
                <span class="label">Test Data:</span>
                <span class="value" id="dataInfo">Up to ~40+ MB</span>
            </span>
            <span class="info-item">
                <span class="label">ISP:</span>
                <span class="value" id="ispInfo">--</span>
            </span>
        </div>
    </div>

    <script>
        // ============================================================
        // SPEED TEST - WITH WORKING UPLOAD USING RELIABLE METHOD
        // ============================================================
        
        let isTesting = false;
        let abortController = null;

        // DOWNLOAD TEST - CLOUDFLARE SPEED TEST EDGE
        // Uses Cloudflare's dedicated bandwidth endpoint instead of tiny
        // JavaScript library files. Multiple streams help fast 4G/5G/Wi-Fi
        // connections reach their available throughput.
        const DOWNLOAD_ENDPOINT = 'https://speed-test.aayushadhikari609.workers.dev';

        // Ping test endpoints
        const PING_URLS = [
            'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
            'https://unpkg.com/three@0.160.0/build/three.min.js',
        ];

        // ============================================================
        // UTILITY FUNCTIONS
        // ============================================================
        
        function updateProgress(phase, progress, statusText) {
            document.getElementById('testPhase').textContent = phase;
            document.getElementById('testProgress').textContent = Math.round(progress) + '%';
            document.getElementById('progressBar').style.width = Math.min(progress, 100) + '%';
            if (statusText) document.getElementById('status').textContent = statusText;
        }

        function setLoading(elementId, isLoading) {
            const el = document.getElementById(elementId);
            if (isLoading) el.classList.add('measuring');
            else el.classList.remove('measuring');
        }

        // ============================================================
        // MEASURE PING
        // ============================================================
        async function measurePing() {
            const pingTimes = [];
            const attempts = 6;
            
            for (let i = 0; i < attempts; i++) {
                const url = PING_URLS[i % PING_URLS.length] + '?cache=' + Date.now() + Math.random();
                const start = performance.now();
                try {
                    await fetch(url, { 
                        method: 'HEAD', 
                        cache: 'no-store',
                        signal: abortController?.signal 
                    });
                    const latency = performance.now() - start;
                    if (latency < 1000) {
                        pingTimes.push(latency);
                    }
                } catch (e) {
                    if (e.name === 'AbortError') throw e;
                }
                
                const progress = ((i + 1) / attempts) * 10;
                updateProgress('Pinging...', progress, `Ping ${i+1}/${attempts}`);
                if (i < attempts - 1) {
                    await new Promise(r => setTimeout(r, 150));
                }
            }

            if (pingTimes.length === 0) return 0;
            pingTimes.sort((a, b) => a - b);
            return Math.round((pingTimes[Math.floor(pingTimes.length / 2)]) * 10) / 10;
        }

        // ============================================================
        // MEASURE DOWNLOAD - MULTI-CONNECTION CLOUDFLARE WORKER
        // ============================================================
        async function measureDownload() {
            const CONNECTIONS = 4;
            const TEST_DURATION = 10000;
            const WARMUP = 1500;
            const CHUNK_SIZE = 5 * 1024 * 1024;
            const startTime = performance.now();
            const measureStart = startTime + WARMUP;
            const stopTime = startTime + TEST_DURATION;
            let measuredBytes = 0;
            let lastUiUpdate = 0;

            const worker = async (connectionId) => {
                while (performance.now() < stopTime) {
                    const requestStart = performance.now();
                    const url = `${DOWNLOAD_ENDPOINT}?bytes=${CHUNK_SIZE}&measId=${Date.now()}-${connectionId}-${Math.random()}`;

                    try {
                        const response = await fetch(url, {
                            method: 'GET',
                            cache: 'no-store',
                            headers: { 'Cache-Control': 'no-cache' },
                            signal: abortController?.signal
                        });

                        if (!response.ok || !response.body) {
                            throw new Error(`Download endpoint returned HTTP ${response.status}`);
                        }

                        const reader = response.body.getReader();
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            const now = performance.now();
                            if (now >= stopTime) {
                                await reader.cancel();
                                return;
                            }

                            if (now >= measureStart) {
                                if (requestStart < measureStart) {
                                    const fraction = Math.min(1, (now - measureStart) / Math.max(1, now - requestStart));
                                    measuredBytes += value.byteLength * fraction;
                                } else {
                                    measuredBytes += value.byteLength;
                                }
                            }

                            if (abortController?.signal.aborted) {
                                await reader.cancel();
                                return;
                            }
                        }
                    } catch (e) {
                        if (e.name === 'AbortError') throw e;
                        console.warn(`Download connection ${connectionId} failed:`, e);
                        await new Promise(r => setTimeout(r, 100));
                    }
                }
            };

            const connections = Array.from({ length: CONNECTIONS }, (_, i) => worker(i));

            while (performance.now() < stopTime) {
                if (abortController?.signal.aborted) throw new DOMException('Aborted', 'AbortError');

                const now = performance.now();
                if (now - lastUiUpdate >= 250) {
                    lastUiUpdate = now;
                    const elapsed = Math.max(0, now - measureStart) / 1000;
                    const measuredSeconds = (TEST_DURATION - WARMUP) / 1000;
                    const progress = elapsed <= 0 ? 10 : 10 + Math.min(50, (elapsed / measuredSeconds) * 50);
                    const liveMbps = elapsed > 0 ? (measuredBytes * 8) / (elapsed * 1000000) : 0;

                    updateProgress('Downloading...', progress, liveMbps > 0 ? `Downloading... ${liveMbps.toFixed(1)} Mbps` : 'Warming up download...');
                }

                await new Promise(r => setTimeout(r, 100));
            }

            await Promise.all(connections);

            const measuredDuration = (TEST_DURATION - WARMUP) / 1000;
            return Math.max(0, (measuredBytes * 8) / (measuredDuration * 1000000));
        }

        // ============================================================
        // UPLOAD TEST - CLOUDFLARE WORKER (MULTI-CONNECTION)
        // ============================================================
        const UPLOAD_ENDPOINT = 'https://speed-test.aayushadhikari609.workers.dev';

        async function measureUpload() {
            if (!UPLOAD_ENDPOINT) {
                throw new Error('Upload endpoint is not configured');
            }

            // Multiple simultaneous streams help saturate fast connections.
            const CONNECTIONS = 4;
            const TEST_DURATION = 8000;
            const CHUNK_SIZE = 1024 * 1024;
            const MAX_IN_FLIGHT_PER_CONNECTION = 2;

            let totalUploaded = 0;
            let running = true;
            let lastUIUpdate = 0;

            function makeRandomData(size) {
                const data = new Uint8Array(size);
                const block = 65536;

                for (let offset = 0; offset < size; offset += block) {
                    const length = Math.min(block, size - offset);
                    crypto.getRandomValues(data.subarray(offset, offset + length));
                }
                return data;
            }

            async function uploadOne(data) {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), TEST_DURATION + 15000);

                try {
                    const response = await fetch(
                        UPLOAD_ENDPOINT + '?t=' + Date.now() + Math.random(),
                        {
                            method: 'POST',
                            body: data,
                            cache: 'no-store',
                            headers: {
                                'Content-Type': 'application/octet-stream',
                                'Cache-Control': 'no-cache'
                            },
                            signal: controller.signal
                        }
                    );

                    if (!response.ok) {
                        throw new Error(`Upload endpoint returned HTTP ${response.status}`);
                    }

                    return data.byteLength;
                } finally {
                    clearTimeout(timeout);
                }
            }

            async function connectionLoop() {
                const inFlight = new Set();

                while (running) {
                    while (running && inFlight.size < MAX_IN_FLIGHT_PER_CONNECTION) {
                        const data = makeRandomData(CHUNK_SIZE);

                        const promise = uploadOne(data)
                            .then(bytes => {
                                totalUploaded += bytes;
                            })
                            .finally(() => {
                                inFlight.delete(promise);
                            });

                        inFlight.add(promise);
                    }

                    if (inFlight.size) {
                        await Promise.race(inFlight);
                    }
                }

                await Promise.allSettled([...inFlight]);
            }

            // One-second warm-up, then an eight-second measurement window.
            const warmupStart = performance.now();
            const workers = Array.from(
                { length: CONNECTIONS },
                () => connectionLoop()
            );

            while (performance.now() - warmupStart < 1000) {
                await new Promise(resolve => setTimeout(resolve, 50));
            }

            const measuredStartBytes = totalUploaded;
            const testStart = performance.now();

            while (performance.now() - testStart < TEST_DURATION) {
                const elapsed = (performance.now() - testStart) / 1000;
                const bytes = totalUploaded - measuredStartBytes;
                const liveSpeed = elapsed > 0
                    ? (bytes * 8) / (elapsed * 1000000)
                    : 0;

                const progress = 60 + Math.min(
                    35,
                    (elapsed / (TEST_DURATION / 1000)) * 35
                );

                if (performance.now() - lastUIUpdate > 150) {
                    updateProgress(
                        'Uploading...',
                        progress,
                        `Uploading... ${liveSpeed.toFixed(1)} Mbps`
                    );
                    lastUIUpdate = performance.now();
                }

                await new Promise(resolve => setTimeout(resolve, 100));
            }

            running = false;
            await Promise.allSettled(workers);

            const duration = (performance.now() - testStart) / 1000;
            const measuredBytes = totalUploaded - measuredStartBytes;

            if (measuredBytes <= 0 || duration <= 0) {
                throw new Error('No upload data was transferred');
            }

            return (measuredBytes * 8) / (duration * 1000000);
        }

        // ============================================================
        // DETECT ISP
        // ============================================================
        async function detectISP() {
            try {
                const response = await fetch('https://ipapi.co/json/', {
                    signal: abortController?.signal
                });
                const data = await response.json();
                return data.org || data.isp || 'Unknown ISP';
            } catch {
                return '--';
            }
        }

        // ============================================================
        // MAIN SPEED TEST
        // ============================================================
        async function startSpeedTest() {
            if (isTesting) return;
            isTesting = true;
            
            const button = document.getElementById('startTest');
            const statusEl = document.getElementById('status');
            const uploadNote = document.getElementById('uploadNote');
            
            // Reset UI
            document.getElementById('downloadSpeed').textContent = '--';
            document.getElementById('uploadSpeed').textContent = '--';
            document.getElementById('ping').textContent = '--';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('testPhase').textContent = 'Starting...';
            document.getElementById('testProgress').textContent = '0%';
            statusEl.className = 'status';
            button.disabled = true;
            button.textContent = 'Testing...';
            statusEl.textContent = 'Initializing...';
            
            uploadNote.className = 'note';
            uploadNote.innerHTML = '⏳ Preparing upload test...';
            
            abortController = new AbortController();
            
            try {
                // Detect ISP
                statusEl.textContent = 'Detecting ISP...';
                const isp = await detectISP();
                document.getElementById('ispInfo').textContent = isp;
                
                // Test Ping
                statusEl.textContent = 'Measuring ping...';
                setLoading('ping', true);
                const pingResult = await measurePing();
                document.getElementById('ping').textContent = pingResult.toFixed(1);
                setLoading('ping', false);
                
                const pingEl = document.getElementById('ping');
                pingEl.style.color = pingResult < 50 ? '#10b981' : 
                                     pingResult < 100 ? '#f59e0b' : '#ef4444';
                
                // Test Download
                statusEl.textContent = 'Testing download speed...';
                document.getElementById('downloadItem').classList.add('active');
                setLoading('downloadSpeed', true);
                const downloadResult = await measureDownload();
                document.getElementById('downloadSpeed').textContent = downloadResult.toFixed(1);
                setLoading('downloadSpeed', false);
                document.getElementById('downloadItem').classList.remove('active');
                
                const downloadEl = document.getElementById('downloadSpeed');
                downloadEl.style.color = downloadResult > 50 ? '#10b981' : 
                                        downloadResult > 20 ? '#f59e0b' : '#ef4444';
                
                // Test Upload
                statusEl.textContent = 'Testing upload speed...';
                uploadNote.innerHTML = '⏳ Measuring upload with multiple connections...';
                document.getElementById('uploadItem').classList.add('active');
                setLoading('uploadSpeed', true);
                const uploadResult = await measureUpload();
                document.getElementById('uploadSpeed').textContent = uploadResult.toFixed(1);
                setLoading('uploadSpeed', false);
                document.getElementById('uploadItem').classList.remove('active');
                
                const uploadEl = document.getElementById('uploadSpeed');
                uploadEl.style.color = uploadResult > 20 ? '#10b981' : 
                                      uploadResult > 5 ? '#f59e0b' : '#ef4444';
                
                // Complete
                updateProgress('Complete!', 100, '✅ Test complete!');
                statusEl.className = 'status success';
                uploadNote.className = 'note success-note';
                uploadNote.innerHTML = '✅ Upload test complete! Multiple connections were used for a more stable result.';
                
            } catch (error) {
                if (error.name === 'AbortError') {
                    statusEl.textContent = '⏹️ Test cancelled';
                } else {
                    statusEl.textContent = '❌ Test failed: ' + error.message;
                    statusEl.className = 'status error';
                }
                console.error('Speed test error:', error);
                uploadNote.className = 'note';
                uploadNote.innerHTML = '⚠️ Upload test encountered an issue. Results may be approximate.';
            } finally {
                button.disabled = false;
                button.textContent = 'Test Again';
                isTesting = false;
                abortController = null;
                document.getElementById('downloadItem').classList.remove('active');
                document.getElementById('uploadItem').classList.remove('active');
                setLoading('downloadSpeed', false);
                setLoading('uploadSpeed', false);
                setLoading('ping', false);
            }
        }

        // Cancel test on page hide
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isTesting && abortController) {
                abortController.abort();
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('dataInfo').textContent = 'Up to ~40+ MB';
            // Test starts when the user clicks "Start Test".
        });
    </script>
</body>
</html>
