<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wifi Jach</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --page-bg: linear-gradient(135deg, #24103f 0%, #4b1f6f 55%, #170b2b 100%);
            --card-bg: #ffffff;
            --text: #333333;
            --muted: #888888;
            --item-bg: #f8f9fa;
            --item-active: #e8ecff;
            --border: #e0e0e0;
            --progress-bg: #e0e0e0;
            --button-bg: rgba(0, 0, 0, 1);
            --button-text: #ffffff;
            --button-shimmer: #ffffff;
            --shadow: rgba(0, 0, 0, 0.30);
            --note-bg: #fef3c7;
            --note-text: #92400e;
        }

        body.dark-mode {
            --page-bg: linear-gradient(135deg, #050505 0%, #0d0d0d 55%, #000000 100%);
            --card-bg: #111827;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --item-bg: #1f2937;
            --item-active: #26336b;
            --border: #374151;
            --progress-bg: #374151;
            --button-bg: rgba(0, 0, 0, 1);
            --button-text: #ffffff;
            --button-shimmer: #ffffff;
            --shadow: rgba(0, 0, 0, 0.55);
            --note-bg: #3b321b;
            --note-text: #fbbf24;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--page-bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 70px 20px 20px;
            transition: background 0.35s ease, color 0.35s ease;
        }

        .theme-toggle {
            position: fixed;
            top: 18px;
            right: 20px;
            z-index: 1000;
            width: 44px;
            height: 44px;
            margin: 0;
            padding: 0;
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 999px;
            background: rgba(0,0,0,0.55);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .theme-toggle:hover {
            transform: translateY(-1px);
            background: rgba(0,0,0,0.72);
            box-shadow: 0 8px 24px rgba(0,0,0,0.22);
        }

        .container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px var(--shadow);
            transition: background 0.35s ease, box-shadow 0.35s ease;
        }

        h1 { text-align: center; color: var(--text); margin-bottom: 5px; font-size: 2em; }
        .subtitle { text-align: center; color: var(--muted); margin-bottom: 30px; font-size: 0.9em; }

        .speed-display {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .speed-item {
            text-align: center;
            padding: 15px;
            background: var(--item-bg);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .speed-item.active {
            background: var(--item-active);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.16);
        }

        .speed-value {
            font-size: 2.2em;
            font-weight: bold;
            color: #667eea;
            transition: all 0.3s ease;
        }

        .speed-value.measuring { animation: pulse 0.8s ease-in-out infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .speed-label { font-size: 0.85em; color: var(--muted); margin-top: 5px; }
        .speed-unit { font-size: 0.5em; color: var(--muted); }

        .progress-container {
            width: 100%;
            height: 10px;
            background: var(--progress-bg);
            border-radius: 5px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        .test-details {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            font-size: 0.85em;
            color: var(--muted);
        }

        .status {
            text-align: center;
            margin-top: 15px;
            color: var(--muted);
            font-size: 0.95em;
            min-height: 24px;
        }

        .status.error { color: #ef4444; }
        .status.success { color: #10b981; }
        .status.warning { color: #f59e0b; }

        /* Requested ShimmerButton-style test button.
           This recreates the Vue ShimmerButton appearance in plain HTML/CSS. */
        .shimmer-button-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 90px;
            margin-top: 6px;
        }

        #startTest {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            width: 100%;
            max-width: 430px;
            min-height: 58px;
            padding: 0 28px;
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 100px;
            background: rgba(0, 0, 0, 1);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(0,0,0,0.28);
            transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
        }

        #startTest::before {
            content: "";
            position: absolute;
            z-index: -1;
            top: -120%;
            left: -45%;
            width: 45%;
            height: 340%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255,255,255,0.05) 35%,
                rgba(255,255,255,0.95) 50%,
                rgba(255,255,255,0.05) 65%,
                transparent 100%
            );
            transform: rotate(18deg);
            animation: shimmer 3s linear infinite;
            pointer-events: none;
        }

        #startTest::after {
            content: "";
            position: absolute;
            inset: 1px;
            z-index: -1;
            border-radius: inherit;
            background: rgba(0,0,0,0.96);
        }

        #startTest span {
            position: relative;
            z-index: 2;
        }

        #startTest:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 38px rgba(0,0,0,0.38);
        }

        #startTest:active {
            transform: translateY(0);
        }

        #startTest:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        #startTest:disabled::before {
            animation-play-state: paused;
        }

        @keyframes shimmer {
            0% { left: -55%; }
            100% { left: 125%; }
        }

        .ip-card { margin-top: 18px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--item-bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .ip-card span { color: var(--muted); font-size: 0.85rem; }
        .ip-card strong { color: #667eea; font-size: 0.95rem; font-weight: 700; word-break: break-all; text-align: right; }

        .info {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: var(--muted);
            flex-wrap: wrap;
            gap: 10px;
        }

        .info-item .value { color: #667eea; font-weight: 600; }

        .note {
            margin-top: 15px;
            padding: 12px;
            background: var(--note-bg);
            border-radius: 8px;
            font-size: 0.85em;
            color: var(--note-text);
            border-left: 4px solid #f59e0b;
        }

        .success-note {
            background: #d1fae5;
            border-color: #10b981;
            color: #065f46;
        }

        body.dark-mode .success-note {
            background: #123b2d;
            color: #6ee7b7;
        }

        @media (max-width: 600px) {
            body { padding: 70px 12px 12px; }
            .container { padding: 20px; }
            .speed-display { grid-template-columns: 1fr; gap: 10px; }
            .speed-value { font-size: 1.8em; }
            .theme-toggle { right: 12px; top: 12px; }
        }
    </style>
</head>
<body>
    <button id="themeToggle" class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Switch theme" title="Switch theme">
        🌙
    </button>

    <div class="container">
        <h1>🚀 Wifi Jach</h1>
        <p class="subtitle" id="tagline">Trust Wifijach , Not your isp!!!!!!</p>

        <div class="speed-display">
            <div class="speed-item" id="downloadItem">
                <div class="speed-value" id="downloadSpeed">--</div>
                <div class="speed-label">Download <span class="speed-unit">Mbps</span></div>
            </div>
            <div class="speed-item" id="uploadItem">
                <div class="speed-value" id="uploadSpeed">--</div>
                <div class="speed-label">Upload <span class="speed-unit">Mbps</span></div>
            </div>
            <div class="speed-item" id="pingItem">
                <div class="speed-value" id="ping">--</div>
                <div class="speed-label">Ping <span class="speed-unit">ms</span></div>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="test-details">
            <span id="testPhase">Ready</span>
            <span id="testProgress">0%</span>
        </div>

        <div class="shimmer-button-wrap">
            <button id="startTest" onclick="startSpeedTest()" type="button">
                <span>Start Test</span>
            </button>
        </div>

        <div class="status" id="status">Click "Start Test" to begin</div>
        <div class="status" id="jitterInfo" style="font-size:0.8em;margin-top:4px;">Jitter: -- ms</div>

        <div class="ip-card">
            <span>Your IP Address</span>
            <strong id="ip">Detecting...</strong>
        </div>

        <div class="info">
            <span class="info-item">
                <span class="label">ISP:</span>
                <span class="value" id="ispInfo">--</span>
            </span>
        </div>
    </div>

    <script>
        // ============================================================
        // SPEED TEST - WITH WORKING UPLOAD USING RELIABLE METHOD
        // ============================================================
        
        let isTesting = false;
        let abortController = null;

        // DOWNLOAD TEST - CLOUDFLARE SPEED TEST EDGE
        // Uses Cloudflare's dedicated bandwidth endpoint instead of tiny
        // JavaScript library files. Multiple streams help fast 4G/5G/Wi-Fi
        // connections reach their available throughput.
        const DOWNLOAD_ENDPOINT = 'https://speed-test.aayushadhikari609.workers.dev';

        // Ping test endpoints
        const PING_URLS = [
            'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
            'https://unpkg.com/three@0.160.0/build/three.min.js',
        ];

        // ============================================================
        // UTILITY FUNCTIONS
        // ============================================================
        
        function updateProgress(phase, progress, statusText) {
            document.getElementById('testPhase').textContent = phase;
            document.getElementById('testProgress').textContent = Math.round(progress) + '%';
            document.getElementById('progressBar').style.width = Math.min(progress, 100) + '%';
            if (statusText) document.getElementById('status').textContent = statusText;
        }

        function setLoading(elementId, isLoading) {
            const el = document.getElementById(elementId);
            if (isLoading) el.classList.add('measuring');
            else el.classList.remove('measuring');
        }

        // ============================================================
        // MEASURE PING + JITTER
        // ============================================================
        async function measurePing() {
            const samples = [];
            const attempts = 12;

            for (let i = 0; i < attempts; i++) {
                const url = PING_URLS[i % PING_URLS.length] +
                    '?cache=' + Date.now() + Math.random();

                const start = performance.now();

                try {
                    await fetch(url, {
                        method: 'HEAD',
                        cache: 'no-store',
                        signal: abortController?.signal
                    });

                    const latency = performance.now() - start;
                    if (latency > 0 && latency < 2000)
                        samples.push(latency);
                } catch (e) {
                    if (e.name === 'AbortError') throw e;
                }

                updateProgress(
                    'Pinging...',
                    ((i + 1) / attempts) * 10,
                    `Ping ${i + 1}/${attempts}`
                );

                await new Promise(r => setTimeout(r, 45));
            }

            if (!samples.length)
                return { ping: 0, jitter: 0 };

            samples.sort((a, b) => a - b);

            const trim = samples.length >= 8 ? 2 : 1;
            const stable = samples.slice(
                trim,
                Math.max(trim + 1, samples.length - trim)
            );

            const ping = stable[Math.floor(stable.length / 2)];

            let jitter = 0;
            for (let i = 1; i < stable.length; i++)
                jitter += Math.abs(stable[i] - stable[i - 1]);

            if (stable.length > 1)
                jitter /= stable.length - 1;

            return {
                ping: Math.round(ping * 10) / 10,
                jitter: Math.round(jitter * 10) / 10
            };
        }

        // ============================================================
        // CONTINUOUS ADAPTIVE DOWNLOAD TEST
        // ============================================================
        async function measureDownload() {
            const WARMUP = 500;
            const TEST_DURATION = 14000;
            const CHUNK_SIZE = 4 * 1024 * 1024;

            let connectionCount = 2;
            let running = true;
            let totalBytes = 0;
            let lastUI = 0;
            let lastSample = performance.now();
            let lastSampleBytes = 0;
            let lastDecision = performance.now();
            let previousRate = 0;
            const samples = [];
            const workers = [];

            const start = performance.now();
            const warmupEnd = start + WARMUP;
            const stopTime = warmupEnd + TEST_DURATION;

            const stream = async (id) => {
                while (running && performance.now() < stopTime) {
                    if (abortController?.signal.aborted)
                        throw new DOMException('Aborted', 'AbortError');

                    try {
                        const response = await fetch(
                            `${DOWNLOAD_ENDPOINT}?bytes=${CHUNK_SIZE}&t=${Date.now()}-${id}-${Math.random()}`,
                            {
                                cache: 'no-store',
                                signal: abortController?.signal
                            }
                        );

                        if (!response.ok || !response.body)
                            throw new Error(`HTTP ${response.status}`);

                        const reader = response.body.getReader();

                        while (true) {
                            const {done, value} = await reader.read();
                            if (done) break;

                            const now = performance.now();

                            if (now >= stopTime) {
                                await reader.cancel();
                                return;
                            }

                            if (now >= warmupEnd)
                                totalBytes += value.byteLength;
                        }
                    } catch (e) {
                        if (e.name === 'AbortError') throw e;
                        await new Promise(r => setTimeout(r, 60));
                    }
                }
            };

            workers.push(stream(0), stream(1));

            while (performance.now() < warmupEnd)
                await new Promise(r => setTimeout(r, 25));

            const measurementStart = performance.now();

            while (performance.now() < stopTime) {
                const now = performance.now();
                const elapsed = (now - measurementStart) / 1000;
                const sampleElapsed = (now - lastSample) / 1000;

                if (sampleElapsed >= 0.5) {
                    const sampleBytes = totalBytes - lastSampleBytes;
                    const rate = sampleBytes * 8 / (sampleElapsed * 1e6);

                    if (rate > 0) samples.push(rate);

                    lastSample = now;
                    lastSampleBytes = totalBytes;
                }

                if (now - lastDecision >= 1500 && elapsed >= 1.5 &&
                    connectionCount < 10) {
                    const recent = samples.slice(-3);
                    const currentRate = recent.length
                        ? recent.reduce((a, b) => a + b, 0) / recent.length
                        : 0;

                    const maxStreams =
                        currentRate < 50 ? 2 :
                        currentRate < 100 ? 4 :
                        currentRate < 300 ? 6 : 8;

                    if (connectionCount < maxStreams &&
                        (previousRate === 0 ||
                         currentRate >= previousRate * 0.97)) {
                        workers.push(stream(connectionCount));
                        connectionCount++;
                    }

                    previousRate = currentRate;
                    lastDecision = now;
                }

                if (now - lastUI >= 150) {
                    const liveMbps = elapsed > 0
                        ? totalBytes * 8 / (elapsed * 1e6) : 0;

                    updateProgress(
                        'Downloading...',
                        10 + Math.min(50, elapsed / 14 * 50),
                        `Downloading... ${liveMbps.toFixed(1)} Mbps • ${connectionCount} streams`
                    );
                    lastUI = now;
                }

                await new Promise(r => setTimeout(r, 40));
            }

            running = false;
            await Promise.allSettled(workers);

            const duration = (performance.now() - measurementStart) / 1000;

            if (totalBytes <= 0)
                throw new Error('No download data was received');

            let stable = samples.slice();

            if (stable.length >= 10) {
                stable.sort((a, b) => a - b);
                const trim = Math.floor(stable.length * 0.10);
                stable = stable.slice(trim, stable.length - trim);
            }

            const sampleAverage = stable.length
                ? stable.reduce((a, b) => a + b, 0) / stable.length
                : 0;

            const totalRate = totalBytes * 8 / (duration * 1e6);

            return {
                speed: sampleAverage > 0
                    ? totalRate * 0.65 + sampleAverage * 0.35
                    : totalRate,
                bytes: totalBytes,
                connections: connectionCount
            };
        }

        // ============================================================
        // CONTINUOUS ADAPTIVE UPLOAD TEST
        // ============================================================
        const UPLOAD_ENDPOINT =
            'https://uploadworker.aayushadhikari609.workers.dev';

        async function measureUpload() {
            const WARMUP = 500;
            const TEST_DURATION = 14000;
            const CHUNK_SIZE = 1024 * 1024;

            let connectionCount = 2;
            let running = true;
            let totalUploaded = 0;

            let lastUI = 0;
            let lastSample = performance.now();
            let lastSampleBytes = 0;
            let lastDecision = performance.now();

            const samples = [];
            const workers = [];

            function makePayload(size) {
                const data = new Uint8Array(size);

                for (let i = 0; i < size; i += 65536) {
                    const end = Math.min(i + 65536, size);
                    crypto.getRandomValues(data.subarray(i, end));
                }

                return data;
            }

            const start = performance.now();
            const warmupEnd = start + WARMUP;
            const stopTime = warmupEnd + TEST_DURATION;

            const uploadStream = async (id) => {
                const payload = makePayload(CHUNK_SIZE);

                while (running && performance.now() < stopTime) {
                    if (abortController?.signal.aborted) {
                        throw new DOMException('Aborted', 'AbortError');
                    }

                    try {
                        const response = await fetch(
                            `${UPLOAD_ENDPOINT}?bytes=${CHUNK_SIZE}&t=${Date.now()}-${id}-${Math.random()}`,
                            {
                                method: 'POST',
                                body: payload,
                                cache: 'no-store',
                                headers: {
                                    'Content-Type':
                                        'application/octet-stream'
                                },
                                signal: abortController?.signal
                            }
                        );

                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }

                        if (performance.now() >= warmupEnd) {
                            totalUploaded += payload.byteLength;
                        }
                    } catch (e) {
                        if (e.name === 'AbortError') throw e;
                        await new Promise(r => setTimeout(r, 25));
                    }
                }
            };

            workers.push(uploadStream(0), uploadStream(1));

            while (performance.now() < warmupEnd) {
                await new Promise(r => setTimeout(r, 20));
            }

            const measurementStart = performance.now();

            while (performance.now() < stopTime) {
                const now = performance.now();
                const elapsed = (now - measurementStart) / 1000;
                const sampleElapsed = (now - lastSample) / 1000;

                if (sampleElapsed >= 0.5) {
                    const sampleBytes =
                        totalUploaded - lastSampleBytes;

                    const rate =
                        sampleBytes * 8 /
                        (sampleElapsed * 1e6);

                    if (rate > 0) samples.push(rate);

                    lastSample = now;
                    lastSampleBytes = totalUploaded;
                }

                if (
                    now - lastDecision >= 1500 &&
                    elapsed >= 1.5 &&
                    connectionCount < 10
                ) {
                    const recent = samples.slice(-3);

                    const currentRate = recent.length
                        ? recent.reduce((a, b) => a + b, 0) /
                          recent.length
                        : 0;

                    let targetStreams;

                    if (currentRate < 50) {
                        targetStreams = 2;
                    } else if (currentRate < 100) {
                        targetStreams = 3;
                    } else if (currentRate < 150) {
                        targetStreams = 4;
                    } else if (currentRate < 200) {
                        targetStreams = 6;
                    } else {
                        targetStreams = 10;
                    }

                    if (connectionCount < targetStreams) {
                        workers.push(
                            uploadStream(connectionCount)
                        );
                        connectionCount++;
                    }

                    lastDecision = now;
                }

                if (now - lastUI >= 150) {
                    const liveMbps = elapsed > 0
                        ? totalUploaded * 8 / (elapsed * 1e6)
                        : 0;

                    updateProgress(
                        'Uploading...',
                        60 + Math.min(35, elapsed / 14 * 35),
                        `Uploading... ${liveMbps.toFixed(1)} Mbps • ${connectionCount} streams`
                    );

                    lastUI = now;
                }

                await new Promise(r => setTimeout(r, 30));
            }

            running = false;
            await Promise.allSettled(workers);

            const duration =
                (performance.now() - measurementStart) / 1000;

            if (totalUploaded <= 0) {
                throw new Error('No upload data was transferred');
            }

            const totalRate =
                totalUploaded * 8 / (duration * 1e6);

            return {
                speed: totalRate,
                bytes: totalUploaded,
                connections: connectionCount,
                samples
            };
        }

        // ============================================================
        // DETECT ISP
        // ============================================================
        async function detectISP() {
            try {
                const response = await fetch('https://ipapi.co/json/', {
                    signal: abortController?.signal
                });
                const data = await response.json();
                return data.org || data.isp || 'Unknown ISP';
            } catch {
                return '--';
            }
        }

        // ============================================================
        // MAIN SPEED TEST
        // ============================================================
        async function startSpeedTest() {
            if (isTesting) return;
            isTesting = true;
            
            const button = document.getElementById('startTest');
            const statusEl = document.getElementById('status');
            
            // Reset UI
            document.getElementById('downloadSpeed').textContent = '--';
            document.getElementById('uploadSpeed').textContent = '--';
            document.getElementById('ping').textContent = '--';
            document.getElementById('jitterInfo').textContent = 'Jitter: -- ms';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('testPhase').textContent = 'Starting...';
            document.getElementById('testProgress').textContent = '0%';
            statusEl.className = 'status';
            button.disabled = true;
            button.textContent = 'Testing...';
            statusEl.textContent = 'Initializing...';
            
            abortController = new AbortController();
            
            try {
                // Detect ISP
                statusEl.textContent = 'Detecting ISP...';
                const isp = await detectISP();
                document.getElementById('ispInfo').textContent = isp;
                
                // Test Ping
                statusEl.textContent = 'Measuring ping...';
                setLoading('ping', true);
                const pingResult = await measurePing();
                document.getElementById('ping').textContent = pingResult.ping.toFixed(1);
                document.getElementById('jitterInfo').textContent = `Jitter: ${pingResult.jitter.toFixed(1)} ms`;
                setLoading('ping', false);
                
                const pingEl = document.getElementById('ping');
                pingEl.style.color = pingResult.ping < 50 ? '#10b981' : 
                                     pingResult.ping < 100 ? '#f59e0b' : '#ef4444';
                
                // Test Download
                statusEl.textContent = 'Testing download speed...';
                document.getElementById('downloadItem').classList.add('active');
                setLoading('downloadSpeed', true);
                const downloadResult = await measureDownload();
                document.getElementById('downloadSpeed').textContent = downloadResult.speed.toFixed(1);
                setLoading('downloadSpeed', false);
                document.getElementById('downloadItem').classList.remove('active');
                
                const downloadEl = document.getElementById('downloadSpeed');
                downloadEl.style.color = downloadResult.speed > 50 ? '#10b981' : 
                                        downloadResult.speed > 20 ? '#f59e0b' : '#ef4444';
                
                // Test Upload
                statusEl.textContent = 'Testing upload speed...';
                document.getElementById('uploadItem').classList.add('active');
                setLoading('uploadSpeed', true);
                const uploadResult = await measureUpload();
                document.getElementById('uploadSpeed').textContent = uploadResult.speed.toFixed(1);
                setLoading('uploadSpeed', false);
                document.getElementById('uploadItem').classList.remove('active');
                
                const uploadEl = document.getElementById('uploadSpeed');
                uploadEl.style.color = uploadResult.speed > 20 ? '#10b981' : 
                                      uploadResult.speed > 5 ? '#f59e0b' : '#ef4444';
                
                // Complete
                updateProgress('Completed', 100, 'Completed');
                statusEl.className = 'status success';
                document.getElementById('tagline').textContent = 'Trust Wifijach , Not your isp!!!!!!';
            } catch (error) {
                if (error.name === 'AbortError') {
                    statusEl.textContent = '⏹️ Test cancelled';
                } else {
                    statusEl.textContent = '❌ Test failed: ' + error.message;
                    statusEl.className = 'status error';
                }
                console.error('Speed test error:', error);
            } finally {
                button.disabled = false;
                button.textContent = 'Test Again';
                isTesting = false;
                abortController = null;
                document.getElementById('downloadItem').classList.remove('active');
                document.getElementById('uploadItem').classList.remove('active');
                setLoading('downloadSpeed', false);
                setLoading('uploadSpeed', false);
                setLoading('ping', false);
            }
        }

        // Cancel test on page hide
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isTesting && abortController) {
                abortController.abort();
            }
        });


        async function getIP() {
            try {
                const response = await fetch("https://api.ipify.org?format=json");
                const data = await response.json();
                document.getElementById("ip").textContent = data.ip;
            } catch (error) {
                document.getElementById("ip").textContent = "Unable to detect";
            }
        }

        // ============================================================
        // LIGHT / DARK THEME
        // ============================================================
        function applyTheme(theme) {
            const isDark = theme === 'dark';
            document.body.classList.toggle('dark-mode', isDark);

            const toggle = document.getElementById('themeToggle');
            if (toggle) {
                toggle.textContent = isDark ? '☀️' : '🌙';
                toggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
            }

            localStorage.setItem('speedTestTheme', theme);
        }

        function toggleTheme() {
            const nextTheme = document.body.classList.contains('dark-mode')
                ? 'light'
                : 'dark';
            applyTheme(nextTheme);
        }

        function initializeTheme() {
            const savedTheme = localStorage.getItem('speedTestTheme');
            const prefersDark = window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: dark)').matches;

            applyTheme(savedTheme || (prefersDark ? 'dark' : 'light'));
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initializeTheme();
            getIP();
            // Test starts when the user clicks "Start Test".
        });
    </script>
</body>
</html>
